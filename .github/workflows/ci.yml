name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.24", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go mod download
      - name: tidy
        shell: bash
        run: go mod tidy && git diff --exit-code -- go.mod $(ls go.sum 2>/dev/null)
      - run: go vet ./...
      - run: go test -race -shuffle=on -coverprofile=cover.out ./...
        if: matrix.os != 'windows-latest'
      - run: go test -shuffle=on ./...
        if: matrix.os == 'windows-latest'
      - run: go test -run='^$' -bench=. -benchtime=100ms ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
